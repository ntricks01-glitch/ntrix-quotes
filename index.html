<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1319">
    <title>NTRIX Energy - Powered by NTRIX IT SERVICES</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Tiro+Kannada&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-page: #0f1319;
            --bg-card: #151b23;
            --gold-main: #ffcc00;
            --gold-glow: rgba(255, 204, 0, 0.4);
            --gold-dim: rgba(255, 204, 0, 0.15);
            --text-white: #ffffff;
            --text-grey: #8b949e;
            --heart-red: #ff4d4d;
            --energy-green: #00ff55;
        }

        html, body {
            height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-page);
            color: var(--text-white); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* === APP HEADER (STREAK & PWA) === */
        .app-header {
            position: fixed; top: 0; left: 0; width: 100%; background: rgba(15, 19, 25, 0.9);
            padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; box-sizing: border-box; border-bottom: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
        }
        .streak-box { font-weight: bold; color: var(--gold-main); font-size: 1.1rem; }
        .install-btn {
            background-color: var(--energy-green); color: black; border: none;
            padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer;
            display: none; /* Hidden until PWA event fires */
        }

        .reels-container {
            position: absolute; top: 50px; /* Offset for header */ left: 0;
            height: calc(100dvh - 50px); width: 100vw; overflow-y: scroll;
            scroll-snap-type: y mandatory; scroll-behavior: smooth;
        }
        .reels-container::-webkit-scrollbar { display: none; }
        .reels-container { -ms-overflow-style: none; scrollbar-width: none; }

        .reel-section {
            height: calc(100dvh - 50px); width: 100vw; scroll-snap-align: start; scroll-snap-stop: always; 
            display: flex; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box;
        }

        /* === SCROLL POPUP === */
        .scroll-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85); border: 2px solid var(--gold-main); color: white;
            padding: 20px 40px; border-radius: 50px; z-index: 1000; text-align: center;
            font-weight: bold; pointer-events: none; transition: opacity 0.5s ease;
            box-shadow: 0 0 20px var(--gold-glow); animation: bounce 2s infinite;
        }
        .scroll-popup span { display: block; font-size: 2rem; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translate(-50%, -50%) translateY(0); } 40% { transform: translate(-50%, -50%) translateY(-15px); } }
        .scroll-popup.hidden { opacity: 0; pointer-events: none; }

        /* === NTRIX STYLES === */
        .ntrix-wrapper {
            width: 100%; max-width: 1200px; background-color: #12161c; border-radius: 25px;
            padding: 20px; border: 1px solid rgba(255,255,255,0.05); display: grid;
            grid-template-areas: "coffee center tea" "water water water";
            grid-template-columns: 240px 1fr 240px; gap: 15px; box-sizing: border-box; height: 100%; max-height: 850px;
        }

        .side-panel {
            background-color: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            padding: 15px; display: flex; flex-direction: column; align-items: flex-start; box-sizing: border-box;
        }
        .side-panel.coffee { grid-area: coffee; } .side-panel.tea { grid-area: tea; }

        .graphic-display { width: 100%; height: 70px; background-color: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; }
        .graphic-display img { width: 40px; height: 40px; animation: float 3s infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .panel-title { color: var(--gold-main); margin: 0 0 5px 0; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; }
        .benefit-list { list-style: none; padding: 0; margin: 0; font-size: 0.75rem; line-height: 1.4; color: #d1d5da; }
        .benefit-list li { margin-bottom: 5px; display: flex; }
        .benefit-list li::before { content: '✔️ '; color: var(--energy-green); margin-right: 5px; font-size: 0.7rem; }

        .center-card {
            grid-area: center; border: 3px solid var(--gold-main); border-radius: 18px;
            padding: 20px; display: flex; flex-direction: column; justify-content: space-between; 
            box-shadow: 0 0 20px var(--gold-glow); box-sizing: border-box; transition: background 0.5s ease;
        }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .logo-box { height: 40px; } .logo-box img { height: 100%; }
        
        .brand-text { text-align: right; }
        .brand-name { font-family: 'Montserrat', sans-serif; font-size: 1rem; margin: 0; color: #fff; }
        .brand-name span { color: var(--energy-green); }
        .brand-tagline { color: var(--gold-main); font-size: 1.2rem; margin-top: 2px; font-weight: 800; }

        .quote-container {
            flex-grow: 1; position: relative; padding: 25px 20px; margin: 5px 0;
            display: flex; justify-content: center; align-items: center; width: 100%; box-sizing: border-box;
        }
        .bracket-tl, .bracket-br { position: absolute; width: 40%; height: 30%; border: 2px solid var(--gold-main); opacity: 0.5; }
        .bracket-tl { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 12px; }
        .bracket-br { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 12px; }

        .quote-text { color: var(--text-white); font-family: 'Tiro Kannada', serif; text-align: center; margin: 0; line-height: 1.5; z-index: 2; }
        .font-xs { font-size: 0.95rem; } .font-sm { font-size: 1.15rem; } .font-md { font-size: 1.4rem; } .font-lg { font-size: 1.7rem; }

        /* === 5-BUTTON GRID === */
        .actions-area { display: flex; flex-direction: column; width: 100%; gap: 10px; }
        .icon-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; background: rgba(0,0,0,0.3); border-radius: 15px; padding: 10px 5px; }
        
        .btn-icon {
            background: none; border: none; color: var(--text-white); display: flex; flex-direction: column; align-items: center;
            font-size: 1.2rem; cursor: pointer; width: 20%; position: relative;
        }
        .btn-icon span.label { font-size: 0.65rem; color: var(--text-grey); margin-top: 4px; font-weight: bold; }
        .btn-icon:hover { color: var(--gold-main); }
        
        .btn-icon.liked { color: var(--heart-red); }
        .btn-icon.saved { color: var(--gold-main); }

        /* HEART BURST ANIMATION */
        .floating-heart {
            position: absolute; bottom: 20px; font-size: 1.5rem; pointer-events: none;
            animation: floatUp 1s ease-out forwards; z-index: 10;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.5) rotate(15deg); }
        }

        .btn-main {
            background-color: var(--gold-main); color: #000; border: none; padding: 14px 20px;
            font-size: 1rem; font-weight: 800; text-decoration: none; border-radius: 30px; text-align: center;
            box-shadow: 0 0 15px var(--gold-dim); width: 100%; display: block;
        }

        .water-section { grid-area: water; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-grey); }
        .water-section img { height: 20px; animation: float 2s infinite alternate; }
        .water-section strong { color: var(--energy-green); font-weight: 700; }

        /* MOBILE COMPRESSION */
        @media (max-width: 950px) {
            .ntrix-wrapper {
                padding: 10px; border-radius: 15px; grid-template-areas: "center center" "coffee tea" "water water";
                grid-template-columns: 1fr 1fr; gap: 8px; height: 100%; max-height: 100%;
            }
            .center-card { padding: 12px; border-width: 2px; }
            .side-panel { padding: 10px; }
            .icon-bar { padding: 5px; }
            .btn-icon { font-size: 1.1rem; }
            .btn-icon span.label { font-size: 0.6rem; }
            .btn-main { padding: 12px 15px; font-size: 0.9rem; }
        }
    </style>

    <script>
        // 1. DYNAMIC BACKGROUND COLORS
        const bgColors = ['#151b23', '#0d1a14', '#1a0d0d', '#0d131a', '#18150a']; 

        // QUOTES
        const kannadaQuotes = [
            "ಗರುಡನಿಗೆ ಕಾಗೆ ಕಾಟ ಕೊಟ್ರೆ, ಗರುಡ ಯಾವತ್ತೂ ಕಾಗೆ ಜೊತೆ ಜಗಳ ಆಡ್ತಾ ಕೂರಲ್ಲ...  ಬದಲಾಗಿ ತನ್ನ ಹಾರಾಟದ ಎತ್ತರನ ಜಾಸ್ತಿ ಮಾಡುತ್ತೆ! ಎತ್ತರಕ್ಕೆ ಹೋದಾಗ ಉಸಿರುಗಟ್ಟಿ ಕಾಗೆ ತಾನಾಗೇ ಕೆಳಗೆ ಬೀಳುತ್ತೆ.  ನಿಮ್ಮ ಬಗ್ಗೆ ಮಾತಾಡೋರ ಜೊತೆ ವಾದ ಮಾಡ್ಬೇಡಿ, ನಿಮ್ಮ 'ಗೆಲುವಿನ ಎತ್ತರ'ನ ಜಾಸ್ತಿ ಮಾಡಿ! ಅವ್ರೇ ಸೈಡ್ ಆಗ್ತಾರೆ.",
            "ಜೋರಾಗಿ ಗಾಳಿ ಬೀಸಿದಾಗ ಸಣ್ಣ 'ದೀಪ' ಮಾತ್ರ ಆರಿಹೋಗುತ್ತೆ... ಆದ್ರೆ ಅದೇ ಗಾಳಿಗೆ, 'ಕಾಡ್ಗಿಚ್ಚು' ಇನ್ನಷ್ಟು ಭೀಕರವಾಗಿ ಹಬ್ಬುತ್ತೆ! ನಿಮ್ಮನ್ನ ಕೆಳಗೆ ಎಳೆಯೋ ಜನರಿಗೆ ದೀಪ ಆಗಬೇಡಿ, ಕಾಡ್ಗಿಚ್ಚಾಗಿ.",
            "ರಸ್ತೆಯಲ್ಲಿ ಬೊಗಳೋ ಪ್ರತಿಯೊಂದು ನಾಯಿಗೂ ಕಲ್ಲು ಹೊಡಿತಾ ಕೂತ್ರೆ, ಅಂದುಕೊಂಡ ಜಾಗ ತಲುಪೋಕೆ ಆಗಲ್ಲ! ನಮ್ಮ ಬಗ್ಗೆ ಮಾತಾಡೋರಿಗೆ ಉತ್ತರ ಕೊಡ್ಬಾರ್ದು, ನಮ್ ಗೆಲುವೇ ಅವರ ಬಾಯಿಗೆ ಬೀಗ ಹಾಕುತ್ತೆ.! wait and watch...!",
            "ನಿಮ್ಮನ್ನ ಕಡೆಗಣಿಸೋ ಜನರ ಹತ್ರ, ಪ್ರೀತಿ ಮತ್ತೆ ಗೌರವನ 'ಭಿಕ್ಷೆ' ಬೇಡೋದು ಮೊದಲು ನಿಲ್ಲಿಸಿ! ಯಾಕಂದ್ರೆ, ಹರಿದು ಹೋಗಿರೋ ನೋಟನ್ನ ದೇವಸ್ಥಾನದ ಹುಂಡಿಗೂ ಯಾರು ಹಾಕಲ್ಲ... ಇನ್ನು ನಿಮ್ಮನ್ನೇ ಬೇಡ ಅನ್ನೋರಿಗೆ, ನಿಮ್ಮ ಲೈಫ್ ಅಲ್ಲಿ 'VIP' ಸೀಟ್ ಯಾಕೆ ಕೊಡ್ತೀರಾ?",
            "ರಾತ್ರಿ ಮಲಗೋವಾಗ ಜಗತ್ತನ್ನೇ ಆಳೋ ಕನಸು... ಆದ್ರೆ ಬೆಳಗ್ಗೆ ಎದ್ದಾಗ ಒಂದು ಸಣ್ಣ 'ಬ್ಲಾಂಕೆಟ್' ನ ಸೋಲಿಸೋ ತಾಕತ್ತಿಲ್ಲ! ಒಂದು ಬೆಡ್‌ಶೀಟ್ ಗೆ ಸೋತು ಮಲಗೋ ನೀವು, ನಾಳೆ ಪ್ರಪಂಚನ ಹೆಂಗೆ ಗೆಲ್ತೀರಾ?  ಕನಸು ನನಸಾಗೋದು ನಿದ್ದೆಯಲ್ಲಲ್ಲ, ನಿರಂತರ ಯುದ್ಧದಲ್ಲಿ! ಕಣ್ಣು ಬಿಡಿ.",

            "ಎಲ್ರಿಗೂ ಯಾವಾಗಲೂ Available ಇರೋದು, ಪ್ರೀತಿ ಭಿಕ್ಷೆ ಬೇಡೋದು ಮೊದಲು ನಿಲ್ಲಿಸಿ! ಯಾಕಂದ್ರೆ, ದೇವಸ್ಥಾನದಲ್ಲಿ 'ಪ್ರಸಾದ' ಫ್ರೀಯಾಗಿ ಸಿಕ್ರೆ ಜನ ಅದನ್ನೇ ನೆಲಕ್ಕೆ ಚೆಲ್ಲಿ ಹೋಗ್ತಾರೆ... ಇನ್ನು ನಿಮ್ಮ ಫ್ರೀ ಟೈಮ್ ಮತ್ತೆ ಪ್ರೀತಿಗೆ ಬೆಲೆ ಕೊಡ್ತಾರಾ? ನಿಮ್ಮ ಬೆಲೆ ನಿಮಗಿರಲಿ. ",

            "ಕಾಲ ಚೆನ್ನಾಗಿದ್ದಾಗ ಜೊತೆಗಿರೋದು ಪ್ರೀತಿ ಅಲ್ಲ... ನಿಮ್ಮ ಹತ್ರ ಏನು ಇಲ್ಲದಿದ್ದಾಗ, \"ನಾನಿದ್ದೀನಿ\" ಅಂತ ನಿಮ್ಮ ಕೈ ಹಿಡಿಯುತ್ತಲ್ಲ, ಆ ಭರವಸೆನೇ ನಿಜವಾದ ಪ್ರೀತಿ! ",
            "ಆಫೀಸ್ ಒಳಗೆ ಬರೀ ಸೀರಿಯಸ್ ವರ್ಕ್ ಫೈಲ್ಸ್ ಅಷ್ಟೇ ಅಲ್ಲ, ಕೆಲವೊಮ್ಮೆ ಸೀಕ್ರೆಟ್ ರೊಮ್ಯಾನ್ಸ್ ಕೂಡ ನಡೆಯುತ್ತೆ... ಪ್ರತಿದಿನ ಕೆಲಸಕ್ಕೆ ಹೋಗೋಕೆ ಇಂಟರೆಸ್ಟ್ ಬರೋದೆ ಆ 'ಒಂದೇ ಒಂದು' ಕಣ್ಣೋಟದಿಂದ!  ನಿಜ ತಾನೇ ?",

            ["ರಾತ್ರಿ ದೃಷ್ಟಿಗಾಗಿ IR ಕ್ಯಾಮೆರಾ ಬಳಸಿ (Use IR Cameras for Night Vision).", "ಕ್ಯಾಮೆರಾ ಲೆನ್ಸ್‌ಗಳನ್ನು ಸ್ವಚ್ಛವಾಗಿಡಿ.", "ಡಿವಿಆರ್ (DVR) ಅನ್ನು ಸುರಕ್ಷಿತ ಸ್ಥಳದಲ್ಲಿ ಇಡಿ.", "ಮೊಬೈಲ್‌ನಲ್ಲಿ ಲೈವ್ ವೀಕ್ಷಣೆ ಪರಿಶೀಲಿಸಿ."],
            ["ಕ್ಯಾಮೆರಾಗಳನ್ನು ಎತ್ತರದಲ್ಲಿ ಅಳವಡಿಸಿ.", "ಕೇಬಲ್‌ಗಳನ್ನು ಮರೆಮಾಡಿ (Conceal cables).", "ರೆಕಾರ್ಡಿಂಗ್ ಬ್ಯಾಕಪ್ ನಿಯಮಿತವಾಗಿ ಚೆಕ್ ಮಾಡಿ.", "ವಿದ್ಯುತ್ ಬ್ಯಾಕಪ್ (UPS) ಬಳಸಿ."]
        ];

        let shuffledQuotes = [...kannadaQuotes].sort(() => 0.5 - Math.random());
        let currentQuoteIndex = 0; let reelCounter = 0; 
        
        const likedState = new Set();
        let currentStreak = parseInt(localStorage.getItem('ntrixStreak') || '0');
        document.getElementById('streakCount').innerText = currentStreak;

        function generateReelHTML(quoteText) {
            reelCounter++;
            const selTech = techTips[Math.floor(Math.random() * techTips.length)];
            const selCctv = cctvTips[Math.floor(Math.random() * cctvTips.length)];
            
            let fontClass = 'font-lg'; const len = quoteText.length;
            if (len > 300) fontClass = 'font-xs'; else if (len > 150) fontClass = 'font-sm'; else if (len > 75) fontClass = 'font-md';

            let techHTML = selTech.map(b => `<li>${b}</li>`).join('');
            let cctvHTML = selCctv.map(b => `<li>${b}</li>`).join('');

            const randomLikes = Math.floor(Math.random() * 450) + 50;
            const randomComments = Math.floor(Math.random() * 50) + 5;
            const bgColor = bgColors[reelCounter % bgColors.length]; // Dynamic Background

            return `
                <div class="ntrix-wrapper">
                    <div class="center-card" id="cardToShare-${reelCounter}" style="background-color: ${bgColor};">
                        <div class="header-row">
                            <div class="logo-box">
                                <img src="Ntrix%20Logo.jpg" alt="NTRIX" style="color: white; font-weight: bold; font-size: 1.2rem;" crossorigin="anonymous">
                            </div>
                            <div class="brand-text">
                                <h2 class="brand-name">NTRIX <span>Energy</span></h2>
                                <div class="brand-tagline">POWERED BY NTRIX IT SERVICES</div>
                            </div>
                        </div>

                        <div class="quote-container">
                            <div class="bracket-tl"></div><div class="bracket-br"></div>
                            <p class="quote-text ${fontClass}" id="quoteText-${reelCounter}">${quoteText}</p>
                        </div>

                        <div class="actions-area" id="actionsArea-${reelCounter}">
                            <div class="icon-bar">
                                <button class="btn-icon" id="likeBtn-${reelCounter}" onclick="toggleLike(this, ${reelCounter}, ${randomLikes})">
                                    <span id="likeIcon-${reelCounter}">♡</span>
                                    <span class="label" id="likeCount-${reelCounter}">${randomLikes}</span>
                                </button>
                                <button class="btn-icon" onclick="openComment(${reelCounter})">
                                    <span>💬</span><span class="label">${randomComments}</span>
                                </button>
                                <button class="btn-icon" id="saveBtn-${reelCounter}" onclick="toggleSave(this, ${reelCounter})">
                                    <span id="saveIcon-${reelCounter}">🔖</span><span class="label">Save</span>
                                </button>
                                <button class="btn-icon" onclick="speakQuote('${quoteText}')">
                                    <span>🔊</span><span class="label">Listen</span>
                                </button>
                                <button class="btn-icon" onclick="shareCurrentQuote(this, ${reelCounter})">
                                    <span>📤</span><span class="label">Share</span>
                                </button>
                            </div>
                            <a href="https://wa.me/919742248550?text=Hi%20Nagendra,%20I%20have%20an%20IT/CCTV%20query." class="btn-main" target="_blank">
                                GET A TECH QUOTE
                            </a>
                        </div>
                    </div>

                    <div class="side-panel coffee">
                        <div class="graphic-display">
                            <img src="https://img.icons8.com/color/48/cyber-security.png" alt="Tech Tip">
                        </div>
                        <h4 class="panel-title">IT Security Tips</h4>
                        <ul class="benefit-list">${techHTML}</ul>
                    </div>

                    <div class="side-panel tea">
                        <div class="graphic-display">
                            <img src="https://img.icons8.com/color/48/dome-camera.png" alt="CCTV Tip">
                        </div>
                        <h4 class="panel-title">CCTV Safety Tips</h4>
                        <ul class="benefit-list">${cctvHTML}</ul>
                    </div>

                    <div class="water-section">
                        <img src="https://img.icons8.com/color/48/water-bottle.png" alt="Water Bottle">
                        <span><strong>REMINDER:</strong> Drink more water & secure your data!</span>
                    </div>
                </div>
            `;
        }

        function loadMoreReels(count = 3) {
            const container = document.getElementById('reelsContainer');
            if (!container) return;
            for(let i=0; i<count; i++) {
                if(currentQuoteIndex >= shuffledQuotes.length) { shuffledQuotes.sort(() => 0.5 - Math.random()); currentQuoteIndex = 0; }
                const quote = shuffledQuotes[currentQuoteIndex++];
                const section = document.createElement('div'); section.className = 'reel-section';
                section.innerHTML = generateReelHTML(quote);
                container.appendChild(section);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadMoreReels(5);
            const container = document.getElementById('reelsContainer');
            const popup = document.getElementById('scrollPopup');
            
            // Increment Streak on first load of the day
            currentStreak++;
            localStorage.setItem('ntrixStreak', currentStreak);
            document.getElementById('streakCount').innerText = currentStreak;

            if(container) {
                container.addEventListener('scroll', () => {
                    if(!popup.classList.contains('hidden')) popup.classList.add('hidden');
                    if (container.scrollTop + container.clientHeight >= container.scrollHeight - 1000) loadMoreReels(3);
                });
            }
        });

        // 3. HEART BURST & LIKE TOGGLE
        function toggleLike(btn, id, baseCount) {
            const icon = document.getElementById(`likeIcon-${id}`);
            const countDisplay = document.getElementById(`likeCount-${id}`);

            if (likedState.has(id)) {
                likedState.delete(id); btn.classList.remove('liked');
                icon.innerHTML = '♡'; countDisplay.innerText = baseCount; 
            } else {
                likedState.add(id); btn.classList.add('liked');
                icon.innerHTML = '❤️'; countDisplay.innerText = baseCount + 1; 
                
                // Burst Animation
                for(let i=0; i<6; i++) {
                    const heart = document.createElement('div');
                    heart.innerHTML = '❤️'; heart.className = 'floating-heart';
                    heart.style.left = Math.random() * 50 + 20 + '%';
                    btn.appendChild(heart);
                    setTimeout(() => heart.remove(), 1000);
                }
            }
        }

        // 4. COMMENTS SYSTEM (Using Prompt/Alert to save space)
        function openComment(id) {
            let userComment = prompt("Drop your opinion on this quote:");
            if(userComment) {
                // Store in local storage to simulate saving
                let comments = JSON.parse(localStorage.getItem('ntrixComments') || '{}');
                if(!comments[id]) comments[id] = [];
                comments[id].push(userComment);
                localStorage.setItem('ntrixComments', JSON.stringify(comments));
                alert("Thank you! Your comment has been saved.");
            }
        }

        // 5. SAVE / BOOKMARK FEATURE
        function toggleSave(btn, id) {
            const icon = document.getElementById(`saveIcon-${id}`);
            if(btn.classList.contains('saved')) {
                btn.classList.remove('saved'); icon.innerHTML = '🔖';
            } else {
                btn.classList.add('saved'); icon.innerHTML = '📑';
                alert("Quote saved to your browser bookmarks!");
            }
        }

        // 6. TEXT TO SPEECH (KANNADA AUDIO)
        function speakQuote(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop current speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'kn-IN'; // Kannada language code
                utterance.rate = 0.9; // Slightly slower for readability
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Sorry, your browser does not support Audio playback.");
            }
        }

        // 7. PWA INSTALL PROMPT
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installAppBtn').style.display = 'block';
        });

        document.getElementById('installAppBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installAppBtn').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // 8. SHARE
        async function shareCurrentQuote(btnElement, idCounter) {
            const originalBtnText = btnElement.innerHTML;
            btnElement.innerHTML = '<span>⏳</span><span class="label">Wait..</span>';
            const cardElement = document.getElementById(`cardToShare-${idCounter}`);
            const actionsArea = document.getElementById(`actionsArea-${idCounter}`);
            const currentQuote = document.getElementById(`quoteText-${idCounter}`).innerText;
            actionsArea.style.display = 'none';

            try {
                if (typeof html2canvas === 'undefined') return alert("Sharing tool loading...");
                const canvas = await html2canvas(cardElement, { backgroundColor: cardElement.style.backgroundColor || '#151b23', scale: 2, useCORS: true });
                canvas.toBlob(async (blob) => {
                    const file = new File([blob], 'NTrix-Quote.png', { type: 'image/png' });
                    const shareText = `"${currentQuote}"\n\nPowered by NTRIX IT SERVICES.\n🌐 View more: ${window.location.href}`;
                    const shareData = { title: 'NTRIX Energy', text: shareText, files: [file] };

                    if (navigator.canShare && navigator.canShare(shareData)) {
                        await navigator.share(shareData);
                    } else {
                        const link = document.createElement('a'); link.download = 'NTrix-Quote.png'; link.href = canvas.toDataURL(); link.click();
                    }
                }, 'image/png');
            } catch (error) {
                alert("Something went wrong. Please try again.");
            } finally {
                actionsArea.style.display = 'flex'; btnElement.innerHTML = originalBtnText;
            }
        }
    </script>
</body>
</html>

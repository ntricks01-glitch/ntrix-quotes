    <style>
        :root {
            --bg-page: #0f1319;
            --bg-card: #151b23;
            --gold-main: #ffcc00;
            --gold-glow: rgba(255, 204, 0, 0.4);
            --gold-dim: rgba(255, 204, 0, 0.15);
            --text-white: #ffffff;
            --text-grey: #8b949e;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .ntrix-wrapper {
            width: 100%;
            max-width: 1200px;
            background-color: #12161c;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            display: grid;
            grid-template-areas: 
                "coffee center tea"
                "water water water";
            grid-template-columns: 240px 1fr 240px;
            gap: 20px;
            box-sizing: border-box;
        }

        /* === SIDE PANELS (Coffee/Tea) === */
        .side-panel {
            background-color: var(--bg-card);
            border: 2px solid var(--gold-main);
            border-radius: 12px;
            padding: 18px 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            box-shadow: inset 0 0 15px var(--gold-dim);
            box-sizing: border-box;
        }
        
        .side-panel.coffee { grid-area: coffee; }
        .side-panel.tea { grid-area: tea; }

        .graphic-display {
            width: 100%;
            height: 110px;
            background-color: #1a2029;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .graphic-display img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .panel-title {
            color: var(--gold-main);
            margin: 0 0 2px 0;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .panel-sub {
            font-size: 0.75rem;
            color: var(--text-grey);
            margin-bottom: 12px;
        }

        .benefit-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #d1d5da;
        }

        .benefit-list li { margin-bottom: 8px; display: flex; }
        .benefit-list li::before {
            content: '- ';
            color: var(--text-grey);
            margin-right: 6px;
        }

        /* === CENTER MAIN CARD === */
        .center-card {
            grid-area: center;
            background-color: var(--bg-card);
            border: 4px solid var(--gold-main);
            border-radius: 18px;
            padding: 25px 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px var(--gold-glow);
            box-sizing: border-box;
            max-width: 100%;
            overflow: hidden;
        }

        /* Branding Header */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Fixed Logo Box for Rectangular NTrix Logo */
        .logo-box {
            background-color: #ffffff;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px 15px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .logo-box img {
            height: 100%;
            width: auto;
            object-fit: contain;
        }

        .brand-text { text-align: right; }
        .brand-name {
            font-family: 'Montserrat', sans-serif;
            color: var(--gold-main);
            font-size: 2rem;
            font-weight: 800;
            margin: 0;
            line-height: 1;
            letter-spacing: 0.5px;
        }
        .brand-tagline {
            color: var(--text-grey);
            font-size: 0.75rem;
            margin-top: 5px;
        }

        /* Quote Box */
        .quote-container {
            flex-grow: 1;
            position: relative;
            padding: 35px 25px;
            margin: 10px 0 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        .bracket-tl, .bracket-br {
            position: absolute;
            width: 60%;
            height: 50%;
            border: 2px solid var(--gold-main);
        }
        .bracket-tl {
            top: 0; left: 0;
            border-right: none; border-bottom: none;
            border-top-left-radius: 12px;
        }
        .bracket-br {
            bottom: 0; right: 0;
            border-left: none; border-top: none;
            border-bottom-right-radius: 12px;
        }

        .quote-text {
            color: var(--text-white);
            font-family: 'Tiro Kannada', serif;
            text-align: center;
            margin: 0;
            line-height: 1.6;
            width: 100%;
            z-index: 2;
        }

        .quote-icons {
            position: absolute;
            bottom: 5px;
            left: 15px;
            display: flex;
            gap: 8px;
            font-size: 1.1rem;
            opacity: 0.8;
            z-index: 2;
        }

        /* Font Sizes */
        .font-xs { font-size: 1.15rem; }
        .font-sm { font-size: 1.4rem; }
        .font-md { font-size: 1.7rem; }
        .font-lg { font-size: 2.1rem; }

        /* === BUTTONS === */
        .action-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Button Box-Sizing prevents spilling over edges */
        .btn-main, .btn-share {
            box-sizing: border-box;
            max-width: 100%;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 700;
            border-radius: 30px;
            transition: 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-share {
            background-color: transparent;
            color: var(--gold-main);
            border: 2px solid var(--gold-main);
            padding: 10px 30px;
            font-size: 1rem;
            gap: 8px;
        }
        .btn-share:hover { background-color: rgba(255, 204, 0, 0.1); }

        .btn-main {
            background-color: var(--gold-main);
            color: #000000;
            border: none;
            padding: 12px 30px;
            font-size: 1.05rem;
            text-decoration: none;
            box-shadow: 0 0 15px var(--gold-dim);
        }
        .btn-main:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .action-footer {
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-grey);
        }

        /* === WATER REMINDER === */
        .water-section {
            grid-area: water;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-grey);
            margin-top: -5px;
        }
        .water-section img {
            height: 25px;
            width: auto;
            animation: float 2s ease-in-out infinite alternate;
        }
        .water-section strong { color: var(--gold-main); font-weight: 700; }

        /* === MOBILE RESPONSIVE LOGIC === */
        @media (max-width: 950px) {
            .ntrix-wrapper {
                padding: 15px;
                border-radius: 20px;
                grid-template-areas: 
                    "center center"
                    "coffee tea"
                    "water water";
                grid-template-columns: 1fr 1fr; 
                gap: 15px;
            }

            .center-card { padding: 20px 15px; }
            .header-row { flex-direction: column; gap: 15px; }
            .brand-text { text-align: center; }
            .brand-name { font-size: 1.6rem; }
            
            .quote-container { padding: 30px 15px; margin: 10px 0 15px 0;}
            .bracket-tl, .bracket-br { width: 80%; height: 40%; }
            
            .font-xs { font-size: 0.95rem; }
            .font-sm { font-size: 1.15rem; }
            .font-md { font-size: 1.4rem; }
            .font-lg { font-size: 1.7rem; }

            /* BUTTONS: Share above Get Quote */
            .action-row { 
                flex-direction: column; 
                align-items: center;
                gap: 12px;
            }
            .btn-share { width: 100%; padding: 12px 20px; order: 1; }
            .btn-main { width: 100%; padding: 14px 20px; order: 2; font-size: 1rem; }
            
            .side-panel { padding: 12px 10px; }
            .panel-title { font-size: 0.85rem; }
            .benefit-list { font-size: 0.75rem; }
            .graphic-display { height: 80px; }
            .graphic-display img { width: 45px; height: 45px; }
        }
    </style>
</head>

    <script>
        const kannadaQuotes = [
            "ಗರುಡನಿಗೆ ಕಾಗೆ ಕಾಟ ಕೊಟ್ರೆ, ಗರುಡ ಯಾವತ್ತೂ ಕಾಗೆ ಜೊತೆ ಜಗಳ ಆಡ್ತಾ ಕೂರಲ್ಲ...  ಬದಲಾಗಿ ತನ್ನ ಹಾರಾಟದ ಎತ್ತರನ ಜಾಸ್ತಿ ಮಾಡುತ್ತೆ! ಎತ್ತರಕ್ಕೆ ಹೋದಾಗ ಉಸಿರುಗಟ್ಟಿ ಕಾಗೆ ತಾನಾಗೇ ಕೆಳಗೆ ಬೀಳುತ್ತೆ.  ನಿಮ್ಮ ಬಗ್ಗೆ ಮಾತಾಡೋರ ಜೊತೆ ವಾದ ಮಾಡ್ಬೇಡಿ, ನಿಮ್ಮ 'ಗೆಲುವಿನ ಎತ್ತರ'ನ ಜಾಸ್ತಿ ಮಾಡಿ! ಅವ್ರೇ ಸೈಡ್ ಆಗ್ತಾರೆ.",
            "ಜೋರಾಗಿ ಗಾಳಿ ಬೀಸಿದಾಗ ಸಣ್ಣ 'ದೀಪ' ಮಾತ್ರ ಆರಿಹೋಗುತ್ತೆ... ಆದ್ರೆ ಅದೇ ಗಾಳಿಗೆ, 'ಕಾಡ್ಗಿಚ್ಚು' ಇನ್ನಷ್ಟು ಭೀಕರವಾಗಿ ಹಬ್ಬುತ್ತೆ! ನಿಮ್ಮನ್ನ ಕೆಳಗೆ ಎಳೆಯೋ ಜನರಿಗೆ ದೀಪ ಆಗಬೇಡಿ, ಕಾಡ್ಗಿಚ್ಚಾಗಿ.",
            "ರಸ್ತೆಯಲ್ಲಿ ಬೊಗಳೋ ಪ್ರತಿಯೊಂದು ನಾಯಿಗೂ ಕಲ್ಲು ಹೊಡಿತಾ ಕೂತ್ರೆ, ಅಂದುಕೊಂಡ ಜಾಗ ತಲುಪೋಕೆ ಆಗಲ್ಲ! ನಮ್ಮ ಬಗ್ಗೆ ಮಾತಾಡೋರಿಗೆ ಉತ್ತರ ಕೊಡ್ಬಾರ್ದು, ನಮ್ ಗೆಲುವೇ ಅವರ ಬಾಯಿಗೆ ಬೀಗ ಹಾಕುತ್ತೆ.! wait and watch...!",
            "ನಿಮ್ಮನ್ನ ಕಡೆಗಣಿಸೋ ಜನರ ಹತ್ರ, ಪ್ರೀತಿ ಮತ್ತೆ ಗೌರವನ 'ಭಿಕ್ಷೆ' ಬೇಡೋದು ಮೊದಲು ನಿಲ್ಲಿಸಿ! ಯಾಕಂದ್ರೆ, ಹರಿದು ಹೋಗಿರೋ ನೋಟನ್ನ ದೇವಸ್ಥಾನದ ಹುಂಡಿಗೂ ಯಾರು ಹಾಕಲ್ಲ... ಇನ್ನು ನಿಮ್ಮನ್ನೇ ಬೇಡ ಅನ್ನೋರಿಗೆ, ನಿಮ್ಮ ಲೈಫ್ ಅಲ್ಲಿ 'VIP' ಸೀಟ್ ಯಾಕೆ ಕೊಡ್ತೀರಾ?",

        const coffeeBenefits = [
            ["Contains Antioxidants.", "Lowers Risk of Some Diseases.", "Boosts Brain Power.", "Great Social Drink."],
            ["Boosts Alertness.", "Improves Cognitive Function.", "Enhances Focus.", "May Increase Metabolism."],
            ["Increases Energy.", "Reduces Fatigue.", "Improves Physical Performance.", "Burns Fat."]
        ];

        const teaBenefits = [
            ["Lowers Blood Pressure.", "Reduces Stress.", "Aids Digestion.", "Improves Heart Health."],
            ["Relaxes the Mind.", "Rich in Antioxidants.", "Hydrates the Body.", "May Calm Nerves."],
            ["Anti-inflammatory Properties.", "Protects Joints.", "Supports Metabolism.", "Boosts Immunity."]
        ];

        function updateDailyContent() {
            // Display Random Quote
            const quoteText = kannadaQuotes[Math.floor(Math.random() * kannadaQuotes.length)];
            const quoteEl = document.getElementById('kannadaQuote');
            quoteEl.innerText = quoteText;

            // Adaptive Typography size mapping
            quoteEl.className = 'quote-text'; 
            const len = quoteText.length;
            if (len > 300) { quoteEl.classList.add('font-xs'); } 
            else if (len > 150) { quoteEl.classList.add('font-sm'); } 
            else if (len > 75) { quoteEl.classList.add('font-md'); } 
            else { quoteEl.classList.add('font-lg'); }

            // Display Random Coffee Benefits
            const selCoffee = coffeeBenefits[Math.floor(Math.random() * coffeeBenefits.length)];
            const cList = document.getElementById('coffeeList');
            cList.innerHTML = '';
            selCoffee.forEach(b => {
                const li = document.createElement('li'); li.innerText = b; cList.appendChild(li);
            });

            // Display Random Tea Benefits
            const selTea = teaBenefits[Math.floor(Math.random() * teaBenefits.length)];
            const tList = document.getElementById('teaList');
            tList.innerHTML = '';
            selTea.forEach(b => {
                const li = document.createElement('li'); li.innerText = b; tList.appendChild(li);
            });
        }

        function shareCurrentQuote() {
            const currentQuote = document.getElementById('kannadaQuote').innerText;
            const shareText = `"${currentQuote}"\n- Shared from NTrix Mugs. Securing your Space, Powering your Tech.`;
            
            if (navigator.share) {
                navigator.share({ title: "Daily Motivation from NTRIX", text: shareText, url: window.location.href })
                .catch(err => console.log('Error sharing:', err));
            } else {
                alert("Native sharing is not supported on this device. You can manually copy this quote:\n\n" + shareText);
            }
        }

        // Initialize on load
        window.onload = updateDailyContent;
    </script>

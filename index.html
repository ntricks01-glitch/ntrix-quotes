<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTRIX Energy - Powered by NTRIX IT SERVICES</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Tiro+Kannada&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-page: #0f1319;
            --bg-card: #151b23;
            --gold-main: #ffcc00;
            --gold-glow: rgba(255, 204, 0, 0.4);
            --gold-dim: rgba(255, 204, 0, 0.15);
            --text-white: #ffffff;
            --text-grey: #8b949e;
            --heart-red: #ff4d4d;
        }

        /* === REELS SCROLLING SETUP === */
        html, body {
            height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-page);
        }

        body {
            color: var(--text-white); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .reels-container {
            position: absolute; top: 0; left: 0; height: 100vh; height: 100dvh; width: 100vw;
            overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth;
        }

        .reels-container::-webkit-scrollbar { display: none; }
        .reels-container { -ms-overflow-style: none; scrollbar-width: none; }

        .reel-section {
            height: 100vh; height: 100dvh; width: 100vw;
            scroll-snap-align: start; scroll-snap-stop: always; 
            display: flex; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box;
        }

        /* === SCROLL POPUP ANIMATION === */
        .scroll-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--gold-main); color: white; padding: 20px 40px; border-radius: 50px; z-index: 1000;
            text-align: center; font-weight: bold; font-size: 1.2rem; pointer-events: none; 
            transition: opacity 0.5s ease, transform 0.5s ease; animation: bounce 2s infinite;
        }
        .scroll-popup span { display: block; font-size: 2rem; margin-bottom: 5px; }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, -50%) translateY(0); }
            40% { transform: translate(-50%, -50%) translateY(-15px); }
            60% { transform: translate(-50%, -50%) translateY(-7px); }
        }
        .scroll-popup.hidden { opacity: 0; transform: translate(-50%, -60%); pointer-events: none; }

        /* === NEW DESKTOP GRID === */
        .ntrix-wrapper {
            width: 100%; max-width: 1300px; background-color: #12161c; border-radius: 25px; padding: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: row; gap: 20px;
            height: 100%; max-height: 900px;
        }

        .side-col { display: flex; flex-direction: column; gap: 15px; width: 240px; flex-shrink: 0; }
        .main-col { flex-grow: 1; display: flex; flex-direction: column; max-width: 100%; overflow: hidden;}

        /* === SIDE PANELS === */
        .side-panel {
            background-color: var(--bg-card); border: 2px solid var(--gold-main); border-radius: 12px;
            padding: 12px; display: flex; flex-direction: column; box-shadow: inset 0 0 15px var(--gold-dim); flex: 1;
        }

        .graphic-display {
            width: 100%; height: 70px; background-color: #1a2029; border-radius: 8px; margin-bottom: 10px;
            display: flex; justify-content: center; align-items: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .graphic-display img { width: 45px; height: 45px; object-fit: contain; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .panel-title { color: var(--gold-main); margin: 0 0 5px 0; font-size: 0.9rem; font-weight: 700; text-transform: uppercase;}
        .benefit-list { list-style: none; padding: 0; margin: 0; font-size: 0.8rem; line-height: 1.4; color: #d1d5da; }
        .benefit-list li { margin-bottom: 5px; display: flex; align-items: flex-start;}
        .benefit-list li::before { content: '•'; color: var(--gold-main); margin-right: 6px; font-size: 1.1em;}

        /* === CENTER CARD & QUOTES === */
        .center-card {
            background: linear-gradient(145deg, #151b23, #0f1319); /* Default Dynamic BG */
            border: 4px solid var(--gold-main); border-radius: 18px; padding: 20px; 
            display: flex; flex-direction: column; justify-content: space-between; 
            box-shadow: 0 0 25px var(--gold-glow); height: 100%; flex-grow: 1; transition: background 0.5s ease;
        }

        .header-row { display: flex; flex-direction: column; align-items: center; margin-bottom: 10px; text-align: center; }
        .logo-box { height: 40px; display: flex; align-items: center; justify-content: center; margin-bottom: 5px;}
        .logo-box img { height: 100%; width: auto; object-fit: contain; }

        /* BRANDING UPDATES */
        .brand-name { font-family: 'Montserrat', sans-serif; color: var(--gold-main); font-size: 1.6rem; font-weight: 800; margin: 0; line-height: 1; }
        .brand-energy { color: #00ff00; font-size: 0.55em; vertical-align: middle; text-transform: uppercase; letter-spacing: 1px;}
        .brand-tagline { color: var(--gold-main); font-size: 1.1rem; margin-top: 5px; font-weight: 800; background: rgba(255,204,0,0.1); padding: 4px 10px; border-radius: 20px; display: inline-block;}

        .quote-container {
            flex-grow: 1; position: relative; padding: 20px; margin: 10px 0;
            display: flex; justify-content: center; align-items: center; width: 100%; box-sizing: border-box;
        }
        .bracket-tl, .bracket-br { position: absolute; width: 40%; height: 40%; border: 2px solid var(--gold-main); }
        .bracket-tl { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 12px; }
        .bracket-br { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 12px; }

        .quote-text { color: var(--text-white); font-family: 'Tiro Kannada', serif; text-align: center; margin: 0; line-height: 1.5; width: 100%; z-index: 2; }
        .font-xs { font-size: 1rem; } .font-sm { font-size: 1.25rem; } .font-md { font-size: 1.5rem; } .font-lg { font-size: 1.8rem; }

        /* === BUTTONS & HEART ANIMATION === */
        .actions-area { display: flex; flex-direction: column; width: 100%; gap: 10px; }
        .action-group-top { display: flex; justify-content: center; gap: 8px; width: 100%; }

        .btn-action {
            background-color: transparent; color: var(--gold-main); border: 2px solid var(--gold-main);
            padding: 10px 0; font-size: 0.9rem; gap: 5px; flex: 1; font-family: 'Segoe UI', sans-serif;
            font-weight: 700; border-radius: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: visible;
        }
        .btn-action:hover { background-color: rgba(255, 204, 0, 0.1); }
        
        .btn-like.liked { color: var(--heart-red); border-color: var(--heart-red); background-color: rgba(255, 77, 77, 0.15); }

        /* Floating Hearts Animation */
        .floating-heart {
            position: absolute; font-size: 1.5rem; pointer-events: none;
            animation: floatUp 1s ease-out forwards; z-index: 50;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.5) rotate(15deg); opacity: 0; }
        }

        .btn-main { background-color: var(--gold-main); color: #000000; border: none; padding: 12px 20px; font-size: 1rem; text-decoration: none; box-shadow: 0 0 15px var(--gold-dim); width: 100%; text-align: center; font-weight: bold; border-radius: 30px;}
        .water-section { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-grey); margin-top: 10px; }
        .water-section img { height: 20px; width: auto; animation: float 2s ease-in-out infinite alternate; }

        /* === COMMENTS MODAL === */
        .comments-modal {
            position: fixed; bottom: -100%; left: 0; width: 100%; height: 60vh; background: #151b23;
            border-top: 2px solid var(--gold-main); border-radius: 20px 20px 0 0; z-index: 2000;
            transition: bottom 0.3s ease-in-out; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
        }
        .comments-modal.active { bottom: 0; }
        .comments-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 10px;}
        .comments-header h3 { margin: 0; color: var(--gold-main); }
        .close-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .comments-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; margin-bottom: 10px; padding-right: 10px;}
        .comment-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; }
        .comment-user { font-weight: bold; font-size: 0.85rem; color: var(--gold-main); margin-bottom: 3px;}
        .comment-text { font-size: 0.9rem; color: #ddd; margin: 0;}
        .comment-input-area { display: flex; gap: 10px; }
        .comment-input-area input { flex-grow: 1; padding: 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; outline: none; }
        .comment-input-area button { background: var(--gold-main); color: black; border: none; padding: 0 20px; border-radius: 20px; font-weight: bold; cursor: pointer;}

        /* === ALL-IN-ONE-PAGE MOBILE COMPRESSION === */
        @media (max-width: 950px) {
            .ntrix-wrapper { flex-direction: column; padding: 10px; gap: 8px; border-radius: 15px; }
            .main-col { max-height: 60%; } /* Keeps center card from eating all space */
            
            /* The 4 micro-panels grid for Mobile */
            .side-col { display: none; /* Hide desktop side columns */ }
            .mobile-panels-grid {
                display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; flex-shrink: 0;
            }
            
            .center-card { padding: 12px; border-width: 2px; border-radius: 12px; }
            .logo-box { height: 30px; margin-bottom: 2px;}
            .brand-name { font-size: 1.3rem; }
            .brand-tagline { font-size: 0.75rem; padding: 2px 8px; margin-top: 2px;}
            
            .quote-container { padding: 15px 10px; margin: 2px 0; }
            .bracket-tl, .bracket-br { width: 70%; height: 35%; border-width: 1px; }
            
            /* Responsive fonts tightened to prevent overflow */
            .font-xs { font-size: 0.85rem; } .font-sm { font-size: 1rem; } .font-md { font-size: 1.15rem; } .font-lg { font-size: 1.4rem; }
            
            /* Micro Panel Styling */
            .side-panel { padding: 6px; border-width: 1px; flex-direction: row; align-items: center; gap: 8px;}
            .graphic-display { width: 35px; height: 35px; margin: 0; border: none; background: transparent;}
            .graphic-display img { width: 25px; height: 25px; }
            .panel-text-content { flex: 1; }
            .panel-title { font-size: 0.65rem; margin-bottom: 2px; }
            .benefit-list { font-size: 0.55rem; line-height: 1.2; }
            .benefit-list li { margin-bottom: 2px; }
            
            .btn-action { padding: 8px 0; font-size: 0.8rem; }
            .btn-main { padding: 10px 15px; font-size: 0.9rem; }
            .water-section { font-size: 0.75rem; margin-top: 2px; }
            .action-group-top { gap: 6px; }
        }
        
        /* Desktop visibility for mobile grid */
        @media (min-width: 951px) { .mobile-panels-grid { display: none; } }
    </style>
</head>

        const teaBenefits = [
            ["ಒತ್ತಡವನ್ನು ಕಡಿಮೆ ಮಾಡುತ್ತದೆ.", "ಹೃದಯದ ಆರೋಗ್ಯವನ್ನು ಸುಧಾರಿಸುತ್ತದೆ."],
            ["ಮನಸ್ಸನ್ನು ಶಾಂತಗೊಳಿಸುತ್ತದೆ.", "ದೇಹವನ್ನು ಹೈಡ್ರೇಟ್ ಮಾಡುತ್ತದೆ."],
            ["ಕೀಲುಗಳನ್ನು ರಕ್ಷಿಸುತ್ತದೆ.", "ರೋಗನಿರೋಧಕ ಶಕ್ತಿಯನ್ನು ಹೆಚ್ಚಿಸುತ್ತದೆ."]
        ];

        // Dynamic Backgrounds for Center Card
        const bgGradients = [
            "linear-gradient(145deg, #151b23, #0f1319)", // Default Dark
            "linear-gradient(145deg, #101914, #0a110d)", // Subtle Green
            "linear-gradient(145deg, #131219, #0a0a11)", // Subtle Purple
            "linear-gradient(145deg, #191410, #110c0a)", // Subtle Orange
            "linear-gradient(145deg, #101519, #0a0e11)"  // Subtle Blue
        ];

        let shuffledQuotes = [...kannadaQuotes].sort(() => 0.5 - Math.random());
        let currentQuoteIndex = 0;
        let reelCounter = 0; 
        
        const likedState = new Set();
        // Store comments locally (simulated database)
        const commentsDB = {};

        function getRandom2(arr) {
            const item = arr[Math.floor(Math.random() * arr.length)];
            return `<li>${item[0]}</li><li>${item[1]}</li>`;
        }

        function generatePanel(title, listHTML, imgUrl) {
            return `
                <div class="side-panel">
                    <div class="graphic-display"><img src="${imgUrl}" alt="Icon"></div>
                    <div class="panel-text-content">
                        <div class="panel-title">${title}</div>
                        <ul class="benefit-list">${listHTML}</ul>
                    </div>
                </div>
            `;
        }

        function generateReelHTML(quoteText) {
            reelCounter++;
            
            // Randomize content
            const itHTML = getRandom2(itTips);
            const cctvHTML = getRandom2(cctvTips);
            const coffeeHTML = getRandom2(coffeeBenefits);
            const teaHTML = getRandom2(teaBenefits);
            const randomBg = bgGradients[Math.floor(Math.random() * bgGradients.length)];
            const randomLikes = Math.floor(Math.random() * 450) + 50;
            
            // Initialize empty comments array for this reel
            commentsDB[reelCounter] = [
                { user: "TechEnthusiast99", text: "Super true! Awesome quote." },
                { user: "BusinessOwner", text: "Needed to hear this today. Thanks NTRIX!" }
            ];
            const commentCount = commentsDB[reelCounter].length;

            let fontClass = 'font-lg';
            if (quoteText.length > 250) fontClass = 'font-xs';
            else if (quoteText.length > 120) fontClass = 'font-sm';
            else if (quoteText.length > 70) fontClass = 'font-md';

            // Desktop Left/Right Columns
            const desktopLeft = `
                <div class="side-col">
                    ${generatePanel("IT SECURITY TIPS", itHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Shield.png")}
                    ${generatePanel("ಕಾಫಿಯ ಪ್ರಯೋಜನಗಳು", coffeeHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Food/Hot%20Beverage.png")}
                </div>
            `;
            const desktopRight = `
                <div class="side-col">
                    ${generatePanel("CCTV SAFETY TIPS", cctvHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Video%20Camera.png")}
                    ${generatePanel("ಚಹಾದ ಪ್ರಯೋಜನಗಳು", teaHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Food/Teacup%20Without%20Handle.png")}
                </div>
            `;

            // Mobile 2x2 Grid (Hidden on Desktop)
            const mobileGrid = `
                <div class="mobile-panels-grid">
                    ${generatePanel("IT SECURITY", itHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Shield.png")}
                    ${generatePanel("CCTV SAFETY", cctvHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Video%20Camera.png")}
                    ${generatePanel("ಕಾಫಿ", coffeeHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Food/Hot%20Beverage.png")}
                    ${generatePanel("ಚಹಾ", teaHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Food/Teacup%20Without%20Handle.png")}
                </div>
            `;

            return `
                <div class="ntrix-wrapper">
                    ${desktopLeft}
                    
                    <div class="main-col">
                        <div class="center-card" id="cardToShare-${reelCounter}" style="background: ${randomBg};">
                            
                            <div class="header-row">
                                <div class="logo-box">
                                    <img src="Ntrix%20Logo.jpg" alt="NTRIX" style="color: white; font-weight: bold; font-size: 1.2rem;" crossorigin="anonymous">
                                </div>
                                <h1 class="brand-name">NTRIX <span class="brand-energy">Energy</span></h1>
                                <div class="brand-tagline">POWERED BY NTRIX IT SERVICES</div>
                            </div>

                            <div class="quote-container">
                                <div class="bracket-tl"></div><div class="bracket-br"></div>
                                <p class="quote-text ${fontClass}" id="quoteText-${reelCounter}">${quoteText}</p>
                            </div>

                            <div class="actions-area" id="actionsArea-${reelCounter}">
                                <div class="action-group-top">
                                    <button class="btn-action btn-like" id="likeBtn-${reelCounter}" onclick="toggleLike(this, ${reelCounter}, ${randomLikes})" title="Like">
                                        <span class="icon" id="likeIcon-${reelCounter}">♡</span>
                                        <span id="likeCount-${reelCounter}">${randomLikes}</span>
                                    </button>
                                    <button class="btn-action" onclick="openComments(${reelCounter})" title="Comment">
                                        <span>💬</span> <span id="btnCommentCount-${reelCounter}">${commentCount}</span>
                                    </button>
                                    <button class="btn-action btn-share" onclick="shareCurrentQuote(this, ${reelCounter})" title="Share">
                                        <span>📤</span> SHARE
                                    </button>
                                </div>
                                <a href="https://wa.me/919742248550?text=Hi%20Nagendra,%20I%20have%20a%20business%20IT/CCTV%20service%20query." class="btn-main" target="_blank">
                                    GET A TECH QUOTE
                                </a>
                            </div>
                        </div>
                    </div>

                    ${desktopRight}
                    ${mobileGrid}
                    
                    <div class="water-section" style="width: 100%;">
                        <img src="https://img.icons8.com/color/48/water-bottle.png" alt="Water Bottle">
                        <span><strong>REMINDER:</strong> Drink more water!</span>
                    </div>
                </div>
            `;
        }

        function loadMoreReels(count = 3) {
            const container = document.getElementById('reelsContainer');
            if (!container) return;
            for(let i=0; i<count; i++) {
                if(currentQuoteIndex >= shuffledQuotes.length) {
                    shuffledQuotes.sort(() => 0.5 - Math.random());
                    currentQuoteIndex = 0;
                }
                const section = document.createElement('div');
                section.className = 'reel-section';
                section.innerHTML = generateReelHTML(shuffledQuotes[currentQuoteIndex++]);
                container.appendChild(section);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadMoreReels(5);
            const container = document.getElementById('reelsContainer');
            const popup = document.getElementById('scrollPopup');
            if(container) {
                container.addEventListener('scroll', () => {
                    if(!popup.classList.contains('hidden')) popup.classList.add('hidden');
                    if (container.scrollTop + container.clientHeight >= container.scrollHeight - 1000) {
                        loadMoreReels(3);
                    }
                });
            }
        });

        // Interactive Heart Burst Like Button
        function toggleLike(btnElement, id, baseCount) {
            const icon = document.getElementById(`likeIcon-${id}`);
            const countDisplay = document.getElementById(`likeCount-${id}`);

            if (likedState.has(id)) {
                // Unlike
                likedState.delete(id);
                btnElement.classList.remove('liked');
                icon.innerHTML = '♡'; 
                countDisplay.innerText = baseCount; 
            } else {
                // Like & Burst Animation
                likedState.add(id);
                btnElement.classList.add('liked');
                icon.innerHTML = '❤️'; 
                countDisplay.innerText = baseCount + 1; 
                
                // Spawn 5 flying hearts
                for(let i=0; i<5; i++){
                    const heart = document.createElement('div');
                    heart.innerHTML = '❤️';
                    heart.className = 'floating-heart';
                    heart.style.left = (20 + Math.random() * 60) + '%';
                    btnElement.appendChild(heart);
                    setTimeout(() => heart.remove(), 1000);
                }
            }
        }

        // Comments System Logic
        let currentCommentReelId = null;

        function openComments(id) {
            currentCommentReelId = id;
            document.getElementById('commentsModal').classList.add('active');
            renderComments();
        }

        function closeComments() {
            document.getElementById('commentsModal').classList.remove('active');
        }

        function renderComments() {
            const list = document.getElementById('commentsList');
            const arr = commentsDB[currentCommentReelId] || [];
            document.getElementById('modalCommentCount').innerText = arr.length;
            
            list.innerHTML = arr.map(c => `
                <div class="comment-item">
                    <div class="comment-user">${c.user}</div>
                    <div class="comment-text">${c.text}</div>
                </div>
            `).join('');
            
            // Auto scroll to bottom
            list.scrollTop = list.scrollHeight;
        }

        function handleCommentEnter(e) {
            if (e.key === 'Enter') postComment();
        }

        function postComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if(!text || !currentCommentReelId) return;

            commentsDB[currentCommentReelId].push({
                user: "You (Guest)",
                text: text
            });
            
            input.value = '';
            renderComments();
            
            // Update button count on the main page
            const btnCount = document.getElementById(`btnCommentCount-${currentCommentReelId}`);
            if(btnCount) btnCount.innerText = commentsDB[currentCommentReelId].length;
        }

        async function shareCurrentQuote(btnElement, idCounter) {
            const shareBtn = btnElement;
            const originalBtnText = shareBtn.innerHTML;
            shareBtn.innerHTML = '<span>⏳</span>...';
            
            const cardElement = document.getElementById(`cardToShare-${idCounter}`);
            const actionsArea = document.getElementById(`actionsArea-${idCounter}`);
            const currentQuote = document.getElementById(`quoteText-${idCounter}`).innerText;
            
            actionsArea.style.display = 'none'; // Hide buttons for screenshot

            try {
                const canvas = await html2canvas(cardElement, {
                    backgroundColor: cardElement.style.background || '#151b23',
                    scale: 2, useCORS: true
                });

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], 'NTrix-Quote.png', { type: 'image/png' });
                    const shareText = `"${currentQuote}"\n\nPOWERED BY NTRIX IT SERVICES.\n🌐 More quotes: ${window.location.href}`;

                    const shareData = { title: 'NTRIX Energy', text: shareText, files: [file] };

                    if (navigator.canShare && navigator.canShare(shareData)) {
                        await navigator.share(shareData);
                    } else {
                        const link = document.createElement('a');
                        link.download = 'NTrix-Quote.png';
                        link.href = canvas.toDataURL();
                        link.click();
                    }
                }, 'image/png');

            } catch (error) {
                console.error(error);
                alert("Something went wrong capturing the image.");
            } finally {
                actionsArea.style.display = 'flex';
                shareBtn.innerHTML = originalBtnText;
            }
        }
    </script>
</body>
</html>

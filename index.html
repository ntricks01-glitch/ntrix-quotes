<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTRIX IT SERVICES - Daily Kannada Motivation</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Tiro+Kannada&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-page: #0f1319;
            --bg-card: #151b23;
            --gold-main: #ffcc00;
            --gold-glow: rgba(255, 204, 0, 0.4);
            --gold-dim: rgba(255, 204, 0, 0.15);
            --text-white: #ffffff;
            --text-grey: #8b949e;
            --heart-red: #ff4d4d;
        }

        /* === REELS SCROLLING SETUP === */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Absolutely prevent body scrolling */
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .reels-container {
            height: 100dvh; /* Uses dynamic viewport height for perfect mobile sizing */
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory; 
            scroll-behavior: smooth;
        }

        /* Hide scrollbar for a cleaner Reel look */
        .reels-container::-webkit-scrollbar { display: none; }
        .reels-container { -ms-overflow-style: none; scrollbar-width: none; }

        .reel-section {
            height: 100dvh;
            width: 100vw;
            scroll-snap-align: start; 
            scroll-snap-stop: always; /* Forces it to snap one item at a time */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* === SCROLL POPUP ANIMATION === */
        .scroll-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--gold-main);
            color: white;
            padding: 20px 40px;
            border-radius: 50px;
            z-index: 1000;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            pointer-events: none; 
            transition: opacity 0.5s ease, transform 0.5s ease;
            box-shadow: 0 0 20px var(--gold-glow);
            animation: bounce 2s infinite;
        }
        
        .scroll-popup span {
            display: block;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, -50%) translateY(0); }
            40% { transform: translate(-50%, -50%) translateY(-15px); }
            60% { transform: translate(-50%, -50%) translateY(-7px); }
        }

        .scroll-popup.hidden {
            opacity: 0;
            transform: translate(-50%, -60%);
        }

        /* === EXISTING NTRIX STYLES === */
        .ntrix-wrapper {
            width: 100%;
            max-width: 1200px;
            background-color: #12161c;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            display: grid;
            grid-template-areas: 
                "coffee center tea"
                "water water water";
            grid-template-columns: 240px 1fr 240px;
            gap: 20px;
            box-sizing: border-box;
        }

        .side-panel {
            background-color: var(--bg-card);
            border: 2px solid var(--gold-main);
            border-radius: 12px;
            padding: 18px 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            box-shadow: inset 0 0 15px var(--gold-dim);
            box-sizing: border-box;
        }
        
        .side-panel.coffee { grid-area: coffee; }
        .side-panel.tea { grid-area: tea; }

        .graphic-display {
            width: 100%;
            height: 110px;
            background-color: #1a2029;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .graphic-display img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .panel-title {
            color: var(--gold-main);
            margin: 0 0 2px 0;
            font-size: 1rem;
            font-weight: 700;
        }

        .panel-sub { font-size: 0.75rem; color: var(--text-grey); margin-bottom: 12px; }

        .benefit-list {
            list-style: none; padding: 0; margin: 0; font-size: 0.85rem; line-height: 1.5; color: #d1d5da;
        }
        .benefit-list li { margin-bottom: 8px; display: flex; }
        .benefit-list li::before { content: '- '; color: var(--text-grey); margin-right: 6px; }

        .center-card {
            grid-area: center;
            background-color: var(--bg-card);
            border: 4px solid var(--gold-main);
            border-radius: 18px;
            padding: 25px 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px var(--gold-glow);
            box-sizing: border-box;
            max-width: 100%;
            overflow: hidden;
        }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo-box { background-color: transparent; height: 50px; display: flex; align-items: center; justify-content: center; }
        .logo-box img { height: 100%; width: auto; object-fit: contain; }

        .brand-text { text-align: right; }
        .brand-name { font-family: 'Montserrat', sans-serif; color: var(--gold-main); font-size: 2rem; font-weight: 800; margin: 0; line-height: 1; letter-spacing: 0.5px; }
        .brand-tagline { color: var(--text-grey); font-size: 0.75rem; margin-top: 5px; }

        .quote-container {
            flex-grow: 1; position: relative; padding: 35px 25px; margin: 10px 0 20px 0;
            display: flex; justify-content: center; align-items: center; width: 100%; box-sizing: border-box;
        }

        .bracket-tl, .bracket-br { position: absolute; width: 60%; height: 50%; border: 2px solid var(--gold-main); }
        .bracket-tl { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 12px; }
        .bracket-br { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 12px; }

        .quote-text {
            color: var(--text-white); font-family: 'Tiro Kannada', serif; text-align: center;
            margin: 0; line-height: 1.6; width: 100%; z-index: 2;
        }

        .quote-icons { position: absolute; bottom: 5px; left: 15px; display: flex; gap: 8px; font-size: 1.1rem; opacity: 0.8; z-index: 2; }

        .font-xs { font-size: 1.15rem; } .font-sm { font-size: 1.4rem; } .font-md { font-size: 1.7rem; } .font-lg { font-size: 2.1rem; }

        /* === BUTTONS === */
        .actions-area { display: flex; flex-direction: column; width: 100%; gap: 10px; }
        
        .action-group-top {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .btn-main, .btn-share, .btn-like {
            box-sizing: border-box; text-align: center; font-family: 'Segoe UI', sans-serif;
            font-weight: 700; border-radius: 30px; transition: 0.2s; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }

        .btn-like {
            background-color: transparent; color: var(--heart-red); border: 2px solid var(--heart-red);
            padding: 10px 30px; font-size: 1rem; gap: 8px; flex: 1;
        }
        .btn-like:hover { background-color: rgba(255, 77, 77, 0.1); }
        .btn-like.liked { background-color: rgba(255, 77, 77, 0.15); }

        .btn-share {
            background-color: transparent; color: var(--gold-main); border: 2px solid var(--gold-main);
            padding: 10px 30px; font-size: 1rem; gap: 8px; flex: 1;
        }
        .btn-share:hover { background-color: rgba(255, 204, 0, 0.1); }

        .btn-main {
            background-color: var(--gold-main); color: #000000; border: none; padding: 14px 30px;
            font-size: 1.05rem; text-decoration: none; box-shadow: 0 0 15px var(--gold-dim); width: 100%;
        }
        .btn-main:hover { transform: scale(1.02); box-shadow: 0 0 20px var(--gold-glow); }

        .action-footer { text-align: center; font-size: 0.65rem; color: var(--text-grey); margin-top: 5px; }

        .water-section { grid-area: water; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--text-grey); margin-top: -5px; }
        .water-section img { height: 25px; width: auto; animation: float 2s ease-in-out infinite alternate; }
        .water-section strong { color: var(--gold-main); font-weight: 700; }

        /* === MOBILE RESPONSIVE LOGIC === */
        @media (max-width: 950px) {
            .ntrix-wrapper {
                padding: 15px; border-radius: 20px;
                grid-template-areas: "center center" "coffee tea" "water water";
                grid-template-columns: 1fr 1fr; gap: 15px;
                max-height: 95vh; overflow-y: auto;
            }
            .center-card { padding: 20px 15px; }
            .header-row { flex-direction: column; gap: 10px; }
            .brand-text { text-align: center; }
            .brand-name { font-size: 1.5rem; }
            .quote-container { padding: 25px 15px; margin: 10px 0 15px 0;}
            .bracket-tl, .bracket-br { width: 80%; height: 40%; }
            .font-xs { font-size: 0.95rem; } .font-sm { font-size: 1.15rem; } .font-md { font-size: 1.4rem; } .font-lg { font-size: 1.7rem; }
            
            .action-group-top { gap: 10px; }
            .btn-like, .btn-share { padding: 12px 15px; font-size: 0.9rem; }
            .btn-main { padding: 14px 20px; font-size: 1rem; }
            
            .side-panel { padding: 12px 10px; }
            .panel-title { font-size: 0.85rem; }
            .benefit-list { font-size: 0.75rem; }
            .graphic-display { height: 80px; }
            .graphic-display img { width: 45px; height: 45px; }
        }
    </style>
</head>
<body>

        <span>👇</span>
        Scroll down for more
    </div>

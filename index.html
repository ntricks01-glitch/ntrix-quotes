<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTRIX Energy - Powered by NTRIX IT SERVICES</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Tiro+Kannada&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-page: #0f1319;
            --bg-card: #151b23;
            --gold-main: #ffcc00;
            --gold-glow: rgba(255, 204, 0, 0.4);
            --gold-dim: rgba(255, 204, 0, 0.15);
            --text-white: #ffffff;
            --text-grey: #8b949e;
            --heart-red: #ff4d4d;
        }

        /* === STATIC PAGE SETUP === */
        html, body {
            height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-page);
        }

        body {
            color: var(--text-white); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .app-container {
            position: absolute; top: 0; left: 0; height: 100vh; height: 100dvh; width: 100vw;
            display: flex; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box;
        }

        /* === DESKTOP GRID === */
        .ntrix-wrapper {
            width: 100%; max-width: 1300px; background-color: #12161c; border-radius: 25px; padding: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: row; gap: 20px;
            height: 100%; max-height: 950px;
        }

        .side-col { display: flex; flex-direction: column; gap: 15px; width: 240px; flex-shrink: 0; }
        .main-col { flex-grow: 1; display: flex; flex-direction: column; max-width: 100%; height: 100%; overflow: hidden;}

        /* === SIDE PANELS === */
        .side-panel {
            background-color: var(--bg-card); border: 2px solid var(--gold-main); border-radius: 12px;
            padding: 12px; display: flex; flex-direction: column; box-shadow: inset 0 0 15px var(--gold-dim); flex: 1;
        }

        .graphic-display {
            width: 100%; height: 70px; background-color: #1a2029; border-radius: 8px; margin-bottom: 10px;
            display: flex; justify-content: center; align-items: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .graphic-display img { width: 45px; height: 45px; object-fit: contain; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .panel-text-content { width: 100%; }
        .panel-title { color: var(--gold-main); margin: 0; font-size: 0.9rem; font-weight: 700; }
        .panel-sub { font-size: 0.75rem; color: var(--text-grey); margin-bottom: 8px; margin-top: 2px;}

        .benefit-list { list-style: none; padding: 0; margin: 0; font-size: 0.8rem; line-height: 1.4; color: #d1d5da; }
        .benefit-list li { margin-bottom: 5px; display: flex; align-items: flex-start;}
        .benefit-list li::before { content: '•'; color: var(--gold-main); margin-right: 6px; font-size: 1.1em;}

        /* === CENTER CARD & QUOTES (WITH DYNAMIC SHIFT ANIMATION) === */
        .center-card {
            border: 4px solid var(--gold-main); border-radius: 18px; padding: 20px; 
            display: flex; flex-direction: column; justify-content: space-between; 
            box-shadow: 0 0 25px var(--gold-glow); flex-grow: 1;
            background-size: 200% 200% !important;
            animation: bgShift 8s ease infinite;
        }
        
        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header-row { display: flex; flex-direction: column; align-items: center; margin-bottom: 10px; text-align: center; }
        .logo-box { height: 40px; display: flex; align-items: center; justify-content: center; margin-bottom: 5px;}
        .logo-box img { height: 100%; width: auto; object-fit: contain; }

        /* BRANDING UPDATES */
        .brand-name { font-family: 'Montserrat', sans-serif; color: var(--gold-main); font-size: 1.6rem; font-weight: 800; margin: 0; line-height: 1; }
        .brand-energy { color: #00ff00; font-size: 0.55em; vertical-align: middle; text-transform: uppercase; letter-spacing: 1px;}
        .brand-tagline { color: rgba(255, 255, 255, 0.6); font-size: 1rem; margin-top: 5px; font-weight: 600; letter-spacing: 0.5px;}

        .quote-container {
            flex-grow: 1; position: relative; padding: 20px; margin: 5px 0;
            display: flex; justify-content: center; align-items: center; width: 100%; box-sizing: border-box;
        }
        .bracket-tl, .bracket-br { position: absolute; width: 40%; height: 40%; border: 2px solid var(--gold-main); }
        .bracket-tl { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 12px; }
        .bracket-br { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 12px; }

        .quote-text { color: var(--text-white); font-family: 'Tiro Kannada', serif; text-align: center; margin: 0; line-height: 1.5; width: 100%; z-index: 2; }
        
        /* Desktop Font Sizes */
        .font-xs { font-size: 1rem; } 
        .font-sm { font-size: 1.25rem; } 
        .font-md { font-size: 1.5rem; } 
        .font-lg { font-size: 1.8rem; }

        /* === LIKE/COMMENT/SHARE BUTTONS === */
        .actions-area { display: flex; flex-direction: column; width: 100%; gap: 10px; margin-bottom: 5px; }
        .action-group-top { display: flex; justify-content: center; gap: 8px; width: 100%; }

        .btn-action {
            background-color: transparent; color: var(--gold-main); border: 2px solid var(--gold-main);
            padding: 10px 0; font-size: 0.9rem; gap: 5px; flex: 1; font-family: 'Segoe UI', sans-serif;
            font-weight: 700; border-radius: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: visible;
        }
        .btn-action:hover { background-color: rgba(255, 204, 0, 0.1); }
        .btn-like.liked { color: var(--heart-red); border-color: var(--heart-red); background-color: rgba(255, 77, 77, 0.15); }

        .floating-heart {
            position: absolute; font-size: 1.5rem; pointer-events: none;
            animation: floatUp 1s ease-out forwards; z-index: 50;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.5) rotate(15deg); opacity: 0; }
        }

        /* GET A TECH QUOTE SECTION */
        .bottom-cta-area { display: flex; flex-direction: column; width: 100%; align-items: center; margin-top: 10px; }
        .btn-main { 
            background-color: var(--gold-main); color: #000000; border: none; padding: 12px 20px; 
            font-size: 1rem; text-decoration: none; box-shadow: 0 0 15px var(--gold-dim); width: 100%; 
            text-align: center; font-weight: bold; border-radius: 30px; display: flex; justify-content: center; align-items: center;
        }
        .action-footer { text-align: center; font-size: 0.65rem; color: var(--text-grey); margin-top: 5px; }

        .water-section { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-grey); margin-top: 10px; }
        .water-section img { height: 20px; width: auto; animation: float 2s ease-in-out infinite alternate; }

        /* === COMMENTS MODAL === */
        .comments-modal {
            position: fixed; bottom: -100%; left: 0; width: 100%; height: 60vh; background: #151b23;
            border-top: 2px solid var(--gold-main); border-radius: 20px 20px 0 0; z-index: 2000;
            transition: bottom 0.3s ease-in-out; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
        }
        .comments-modal.active { bottom: 0; }
        .comments-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 10px;}
        .comments-header h3 { margin: 0; color: var(--gold-main); }
        .close-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .comments-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; padding-right: 5px;}
        .comment-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; position: relative;}
        .comment-user { font-weight: bold; font-size: 0.85rem; color: var(--gold-main); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center;}
        .reply-btn { background: none; border: none; color: var(--text-grey); font-size: 0.75rem; cursor: pointer; font-weight: bold;}
        .reply-btn:hover { color: white; }
        .comment-text { font-size: 0.9rem; color: #ddd; margin: 0; line-height: 1.4;}
        .comment-input-area { display: flex; gap: 10px; }
        .comment-input-area input { flex-grow: 1; padding: 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; outline: none; }
        .comment-input-area button { background: var(--gold-main); color: black; border: none; padding: 0 20px; border-radius: 20px; font-weight: bold; cursor: pointer;}

        /* === ULTRA-COMPRESSED MOBILE LAYOUT (INCREASED PANEL TEXT) === */
        @media (max-width: 950px) {
            .ntrix-wrapper { flex-direction: column; padding: 8px; gap: 5px; border-radius: 15px; max-height: 99vh;}
            .main-col { flex-grow: 1; min-height: 0; } 
            
            .side-col { display: none; }
            .mobile-panels-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 100%; flex-shrink: 0; }
            
            /* Center Quote Box tweaked to make room for panels */
            .center-card { padding: 8px 10px; border-width: 2px; border-radius: 12px; justify-content: space-evenly;}
            .logo-box { height: 26px; margin-bottom: 2px;}
            .brand-name { font-size: 1.15rem; }
            .brand-tagline { font-size: 0.65rem; margin-top: 2px;}
            
            .quote-container { padding: 5px; margin: 0; }
            .bracket-tl, .bracket-br { width: 50%; height: 30%; border-width: 1px; }
            
            /* Reduced quote text size slightly to prevent overflow */
            .font-xs { font-size: 0.8rem; } 
            .font-sm { font-size: 0.9rem; } 
            .font-md { font-size: 1.05rem; } 
            .font-lg { font-size: 1.25rem; }
            
            .actions-area { margin-bottom: 0; gap: 5px; }
            .action-group-top { gap: 5px; }
            .btn-action { padding: 6px 0; font-size: 0.85rem; }
            
            /* === MICRO PANELS (INCREASED FONT SIZES) === */
            .side-panel { padding: 6px 8px; flex-direction: row; align-items: flex-start; gap: 8px;}
            .graphic-display { width: 32px; height: 32px; margin: 0; border: none; background: transparent; flex-shrink: 0;}
            .graphic-display img { width: 24px; height: 24px; }
            
            .panel-text-content { display: flex; flex-direction: column; justify-content: center; }
            
            .panel-title { font-size: 0.75rem; margin-bottom: 1px; } 
            .panel-sub { font-size: 0.65rem; margin-bottom: 3px; } 
            .benefit-list { font-size: 0.68rem; line-height: 1.25; } 
            .benefit-list li { margin-bottom: 2px; }
            
            /* Bottom CTA Section */
            .water-section { font-size: 0.75rem; margin-top: 2px; }
            
            .bottom-cta-area { margin-top: 2px; padding-bottom: 2px;}
            .btn-main { padding: 8px 12px; font-size: 0.85rem; }
            .action-footer { font-size: 0.55rem; margin-top: 2px; }
        }
        @media (min-width: 951px) { .mobile-panels-grid { display: none; } }
    </style>
</head>

        const cctvTips = [
            ["ಕ್ಯಾಮೆರಾ ಲೆನ್ಸ್‌ಗಳನ್ನು ತಿಂಗಳಿಗೊಮ್ಮೆ ಸ್ವಚ್ಛಗೊಳಿಸಿ.", "ಡಿವಿಆರ್ ಸ್ಟೋರೇಜ್ ವಾರಕ್ಕೊಮ್ಮೆ ಪರಿಶೀಲಿಸಿ."],
            ["ಪ್ರವೇಶ ದ್ವಾರಗಳನ್ನು ಕ್ಯಾಮೆರಾಗಳು ಕವರ್ ಮಾಡಲಿ.", "ರಾತ್ರಿ ದೃಷ್ಟಿಗಾಗಿ ಐಆರ್ ಕ್ಯಾಮೆರಾಗಳನ್ನು ಬಳಸಿ."],
            ["ಲಾಕ್ ಮಾಡಿದ ಕ್ಯಾಬಿನೆಟ್‌ನಲ್ಲಿ ಡಿವಿಆರ್ ಇರಿಸಿ.", "ಯುಪಿಎಸ್ ಬ್ಯಾಕಪ್ ನಿಯಮಿತವಾಗಿ ಪರಿಶೀಲಿಸಿ."],
            ["ಹೊಳಪನ್ನು ತಪ್ಪಿಸಲು ಕೋನಗಳನ್ನು ಹೊಂದಿಸಿ.", "ಭದ್ರತೆಗಾಗಿ ಫರ್ಮ್‌ವೇರ್ ಅಪ್‌ಡೇಟ್ ಮಾಡಿ."]
        ];
        const coffeeBenefits = [
            ["ಆಂಟಿಆಕ್ಸಿಡೆಂಟ್‌ಗಳನ್ನು ಹೊಂದಿದೆ.", "ಮೆದುಳಿನ ಶಕ್ತಿಯನ್ನು ಹೆಚ್ಚಿಸುತ್ತದೆ."],
            ["ಎಚ್ಚರಿಕೆಯನ್ನು ಹೆಚ್ಚಿಸುತ್ತದೆ.", "ಚಯಾಪಚಯವನ್ನು ಹೆಚ್ಚಿಸಬಹುದು."],
            ["ಶಕ್ತಿಯನ್ನು ಹೆಚ್ಚಿಸುತ್ತದೆ.", "ಆಯಾಸವನ್ನು ಕಡಿಮೆ ಮಾಡುತ್ತದೆ."]
        ];
        const teaBenefits = [
            ["ಒತ್ತಡವನ್ನು ಕಡಿಮೆ ಮಾಡುತ್ತದೆ.", "ಹೃದಯದ ಆರೋಗ್ಯವನ್ನು ಸುಧಾರಿಸುತ್ತದೆ."],
            ["ಮನಸ್ಸನ್ನು ಶಾಂತಗೊಳಿಸುತ್ತದೆ.", "ದೇಹವನ್ನು ಹೈಡ್ರೇಟ್ ಮಾಡುತ್ತದೆ."],
            ["ಕೀಲುಗಳನ್ನು ರಕ್ಷಿಸುತ್ತದೆ.", "ರೋಗನಿರೋಧಕ ಶಕ್ತಿಯನ್ನು ಹೆಚ್ಚಿಸುತ್ತದೆ."]
        ];

        // Dynamic Backgrounds Array (CSS Gradients)
        const bgGradients = [
            "linear-gradient(135deg, #151b23, #0a0d12, #151b23)", 
            "linear-gradient(135deg, #101914, #050a07, #101914)", 
            "linear-gradient(135deg, #131219, #07070a, #131219)", 
            "linear-gradient(135deg, #191410, #0a0705, #191410)", 
            "linear-gradient(135deg, #101519, #05070a, #101519)"  
        ];

        let reelCounter = 0; 
        const likedState = new Set();
        
        // --- Persistent Dynamic User Identity & Comments ---
        let sessionUsername = localStorage.getItem('ntrix_username');
        if (!sessionUsername) {
            sessionUsername = "User_" + Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem('ntrix_username', sessionUsername);
        }

        let commentsDB = JSON.parse(localStorage.getItem('ntrix_comments')) || {};

        function getRandom2(arr) {
            const item = arr[Math.floor(Math.random() * arr.length)];
            return `<li>${item[0]}</li><li>${item[1]}</li>`;
        }

        function generatePanel(title, subtitle, listHTML, imgUrl) {
            return `
                <div class="side-panel">
                    <div class="graphic-display"><img src="${imgUrl}" alt="Icon" crossorigin="anonymous"></div>
                    <div class="panel-text-content">
                        <div class="panel-title">${title}</div>
                        <div class="panel-sub">${subtitle}</div>
                        <ul class="benefit-list">${listHTML}</ul>
                    </div>
                </div>
            `;
        }

        function generateStaticHTML(quoteText) {
            reelCounter = 1; // Since there is only one quote on the page now
            
            const originalQuoteId = kannadaQuotes.indexOf(quoteText);
            if (!commentsDB[originalQuoteId]) {
                commentsDB[originalQuoteId] = []; 
            }
            const commentCount = commentsDB[originalQuoteId].length;

            const itHTML = getRandom2(itTips);
            const cctvHTML = getRandom2(cctvTips);
            const coffeeHTML = getRandom2(coffeeBenefits);
            const teaHTML = getRandom2(teaBenefits);
            const randomBg = bgGradients[Math.floor(Math.random() * bgGradients.length)];
            const randomLikes = Math.floor(Math.random() * 450) + 50;

            let fontClass = 'font-lg';
            if (quoteText.length > 250) fontClass = 'font-xs';
            else if (quoteText.length > 120) fontClass = 'font-sm';
            else if (quoteText.length > 70) fontClass = 'font-md';

            // Exact English Title formatting
            const desktopLeft = `
                <div class="side-col">
                    ${generatePanel("IT SECURITY TIPS", "(Daily Tip):", itHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Shield.png")}
                    ${generatePanel("Coffee Benefits", "(Changes Daily):", coffeeHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Food/Hot%20Beverage.png")}
                </div>
            `;
            const desktopRight = `
                <div class="side-col">
                    ${generatePanel("CCTV TIPS", "(Daily Tip):", cctvHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Video%20Camera.png")}
                    ${generatePanel("Tea Benefits", "(Changes Daily):", teaHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Food/Teacup%20Without%20Handle.png")}
                </div>
            `;
            const mobileGrid = `
                <div class="mobile-panels-grid">
                    ${generatePanel("IT SECURITY TIPS", "(Daily Tip):", itHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Shield.png")}
                    ${generatePanel("CCTV TIPS", "(Daily Tip):", cctvHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Video%20Camera.png")}
                    ${generatePanel("Coffee Benefits", "(Changes Daily):", coffeeHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Food/Hot%20Beverage.png")}
                    ${generatePanel("Tea Benefits", "(Changes Daily):", teaHTML, "https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Food/Teacup%20Without%20Handle.png")}
                </div>
            `;

            return `
                <div class="ntrix-wrapper">
                    ${desktopLeft}
                    
                    <div class="main-col">
                        <div class="center-card" id="cardToShare-${reelCounter}" style="background-image: ${randomBg};">
                            
                            <div class="header-row">
                                <div class="logo-box">
                                    <img src="Ntrix%20Logo.jpg" alt="NTRIX" style="color: white; font-weight: bold; font-size: 1.2rem;" crossorigin="anonymous">
                                </div>
                                <h1 class="brand-name">NTRIX <span class="brand-energy">Energy</span></h1>
                                <div class="brand-tagline">POWERED BY NTRIX IT SERVICES</div>
                            </div>

                            <div class="quote-container">
                                <div class="bracket-tl"></div><div class="bracket-br"></div>
                                <p class="quote-text ${fontClass}" id="quoteText-${reelCounter}">${quoteText}</p>
                            </div>

                            <div class="actions-area" id="actionsArea-${reelCounter}">
                                <div class="action-group-top">
                                    <button class="btn-action btn-like" id="likeBtn-${reelCounter}" onclick="toggleLike(this, ${reelCounter}, ${randomLikes})" title="Like">
                                        <span class="icon" id="likeIcon-${reelCounter}">♡</span>
                                        <span id="likeCount-${reelCounter}">${randomLikes}</span>
                                    </button>
                                    <button class="btn-action" onclick="openComments(${originalQuoteId}, ${reelCounter})" title="Comment">
                                        <span>💬</span> <span id="btnCommentCount-${reelCounter}">${commentCount}</span>
                                    </button>
                                    <button class="btn-action btn-share" onclick="shareCurrentQuote(this, ${reelCounter})" title="Share">
                                        <span>📤</span> SHARE
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    ${desktopRight}
                    ${mobileGrid}
                    
                    <div class="water-section" style="width: 100%;">
                        <img src="https://img.icons8.com/color/48/water-bottle.png" alt="Water Bottle" crossorigin="anonymous">
                        <span><strong>REMINDER:</strong> Drink more water!</span>
                    </div>

                    <div class="bottom-cta-area">
                        <a href="https://wa.me/919742248550?text=Hi%20Nagendra,%20I%20have%20a%20business%20IT/CCTV%20service%20query." class="btn-main" target="_blank">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WA" style="height: 22px; margin-right: 10px;" crossorigin="anonymous">
                            GET A TECH SERVICE
                        </a>
                        <div class="action-footer">Request consultation for business queries</div>
                    </div>

                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('appContainer');
            // Pick a single random quote on page load
            const randomQuote = kannadaQuotes[Math.floor(Math.random() * kannadaQuotes.length)];
            container.innerHTML = generateStaticHTML(randomQuote);
        });

        function toggleLike(btnElement, id, baseCount) {
            const icon = document.getElementById(`likeIcon-${id}`);
            const countDisplay = document.getElementById(`likeCount-${id}`);

            if (likedState.has(id)) {
                likedState.delete(id);
                btnElement.classList.remove('liked');
                icon.innerHTML = '♡'; 
                countDisplay.innerText = baseCount; 
            } else {
                likedState.add(id);
                btnElement.classList.add('liked');
                icon.innerHTML = '❤️'; 
                countDisplay.innerText = baseCount + 1; 
                
                for(let i=0; i<5; i++){
                    const heart = document.createElement('div');
                    heart.innerHTML = '❤️';
                    heart.className = 'floating-heart';
                    heart.style.left = (20 + Math.random() * 60) + '%';
                    btnElement.appendChild(heart);
                    setTimeout(() => heart.remove(), 1000);
                }
            }
        }

        // --- Persistent Comments Logic ---
        let activeQuoteId = null; 
        let activeReelCounter = null;

        function openComments(quoteId, reelId) {
            activeQuoteId = quoteId;
            activeReelCounter = reelId;
            document.getElementById('commentsModal').classList.add('active');
            renderComments();
        }

        function closeComments() {
            document.getElementById('commentsModal').classList.remove('active');
        }

        function replyTo(username) {
            const input = document.getElementById('commentInput');
            input.value = `@${username} `;
            input.focus();
        }

        function renderComments() {
            const list = document.getElementById('commentsList');
            const arr = commentsDB[activeQuoteId] || [];
            document.getElementById('modalCommentCount').innerText = arr.length;
            
            if (arr.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:gray; margin-top: 20px;">Be the first to comment!</div>`;
            } else {
                list.innerHTML = arr.map(c => `
                    <div class="comment-item">
                        <div class="comment-user">
                            ${c.user} 
                            <button class="reply-btn" onclick="replyTo('${c.user}')">Reply</button>
                        </div>
                        <div class="comment-text">${c.text}</div>
                    </div>
                `).join('');
            }
            list.scrollTop = list.scrollHeight;
        }

        function handleCommentEnter(e) {
            if (e.key === 'Enter') postComment();
        }

        function postComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if(!text || activeQuoteId === null) return;

            commentsDB[activeQuoteId].push({
                user: sessionUsername,
                text: text
            });
            
            localStorage.setItem('ntrix_comments', JSON.stringify(commentsDB));
            
            input.value = '';
            renderComments();
            
            const btnCount = document.getElementById(`btnCommentCount-${activeReelCounter}`);
            if(btnCount) btnCount.innerText = commentsDB[activeQuoteId].length;
        }

        async function shareCurrentQuote(btnElement, idCounter) {
            const shareBtn = btnElement;
            const originalBtnText = shareBtn.innerHTML;
            shareBtn.innerHTML = '<span>⏳</span>...';
            
            const cardElement = document.getElementById(`cardToShare-${idCounter}`);
            const actionsArea = document.getElementById(`actionsArea-${idCounter}`);
            const currentQuote = document.getElementById(`quoteText-${idCounter}`).innerText;
            
            actionsArea.style.display = 'none'; 

            try {
                const canvas = await html2canvas(cardElement, {
                    scale: 2, 
                    useCORS: true,
                    backgroundColor: null 
                });

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                const file = new File([blob], 'NTrix-Quote.png', { type: 'image/png' });
                
                const shareText = `"${currentQuote}"\n\nPOWERED BY NTRIX IT SERVICES.\n🌐 More quotes: ${window.location.href}`;
                const shareData = { title: 'NTRIX Energy', text: shareText, files: [file] };

                if (navigator.canShare && navigator.canShare(shareData)) {
                    await navigator.share(shareData);
                } else {
                    const link = document.createElement('a');
                    link.download = 'NTrix-Quote.png';
                    link.href = canvas.toDataURL();
                    link.click();
                }
            } catch (error) {
                console.error("Capture Error:", error);
                alert("Something went wrong capturing the image.");
            } finally {
                actionsArea.style.display = 'flex';
                shareBtn.innerHTML = originalBtnText;
            }
        }
    </script>
</body>
</html>
